name: Sync official WebKitty source into JOSDANY92

on:
  push:
    branches:
      - JOSDANY92-V2.1
    paths:
      - .github/workflows/sync-webkitty-source.yml
      - ACTIVACION-GOLDHEN.html
      - patches/webkitty/apply-josdany92-patches.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-webkitty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: JOSDANY92-V2.1
          fetch-depth: 0

      - name: Download official WebKitty source
        run: |
          set -euo pipefail
          git clone https://github.com/ArabPixel/WebKitty.git /tmp/WebKitty
          # Pin the reviewed upstream snapshot; update this SHA only after a deliberate review.
          git -C /tmp/WebKitty checkout --detach bb5b65b8b7935f91a61516f06dbddb9f07674cd6
          test -f /tmp/WebKitty/index.html
          test -f /tmp/WebKitty/LICENSE
          test -f /tmp/WebKitty/includes/caches/manifest/12xx.manifest
          test -f /tmp/WebKitty/includes/payloads/HEN/goldhen_v2.4b18.14.bin
          test -f /tmp/WebKitty/includes/js/HENs.js
          test -f /tmp/WebKitty/includes/js/firmware.js
          test -f /tmp/WebKitty/src/wobkot/main.js
          grep -q "GHv2.4b18.14" /tmp/WebKitty/includes/js/HENs.js
          grep -q "WOBKOT_LAPSE" /tmp/WebKitty/includes/js/firmware.js
          git -C /tmp/WebKitty rev-parse HEAD > /tmp/WEBKITTY-UPSTREAM-COMMIT.txt

      - name: Vendor WebKitty into this repository
        env:
          TARGET_BRANCH: JOSDANY92-V2.1
        run: |
          set -euo pipefail
          rm -rf WebKitty
          mkdir -p WebKitty
          rsync -a --exclude='.git' --exclude='.github' /tmp/WebKitty/ WebKitty/
          python3 patches/webkitty/apply-josdany92-patches.py
          grep -q 'JOSDANY92: record successful GoldHEN payload completion.' WebKitty/includes/js/utilities.js
          cp /tmp/WEBKITTY-UPSTREAM-COMMIT.txt WEBKITTY-UPSTREAM-COMMIT.txt
          test -f WebKitty/index.html
          test -f WebKitty/includes/caches/manifest/12xx.manifest
          test -f WebKitty/includes/payloads/HEN/goldhen_v2.4b18.14.bin
          # Verify critical vendored binaries and exploit assets against the pinned upstream Git blobs.
          for path in \
            includes/payloads/HEN/goldhen_v2.4b18.14.bin \
            src/kpatches/1200.bin \
            src/wobkot/main.js \
            includes/caches/manifest/12xx.manifest \
            LICENSE; do
            upstream_blob="$(git -C /tmp/WebKitty rev-parse "HEAD:$path")"
            local_blob="$(git hash-object "WebKitty/$path")"
            test "$upstream_blob" = "$local_blob"
          done
          git status --short
          git add WebKitty WEBKITTY-UPSTREAM-COMMIT.txt
          if git diff --cached --quiet; then
            echo "Official WebKitty source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vendor official WebKitty source for GoldHEN activation [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"
